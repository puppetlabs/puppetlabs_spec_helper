name: "ci"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:

  spec:
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - '3.2'
          - '3.3'
          - '4.0'
        include:
          - ruby_version: '3.2'
            puppet_gem_version: '~> 8.0'
          - ruby_version: '3.3'
            puppet_gem_version: '~> 8.0'
          - ruby_version: '4.0'
            puppet_gem_version: '~> 9.0'
    name: "spec (ruby ${{ matrix.ruby_version }} | puppet ${{ matrix.puppet_gem_version }})"
    uses: "puppetlabs/cat-github-actions/.github/workflows/gem_ci.yml@main"
    secrets: "inherit"
    with:
      rake_task: "spec:coverage"
      ruby_version: ${{ matrix.ruby_version }}
      puppet_gem_version: ${{ matrix.puppet_gem_version }}

  acceptance:
    needs: spec
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - '3.2'
          - '3.3'
          - '4.0'
        include:
          - ruby_version: '3.2'
            puppet_version: '~> 8.0'
          - ruby_version: '3.3'
            puppet_version: '~> 8.0'
          - ruby_version: '4.0'
            puppet_version: '~> 9.0'
    uses: "puppetlabs/cat-github-actions/.github/workflows/gem_acceptance.yml@main"
    secrets: "inherit"
    with:
      ruby_version: ${{ matrix.ruby_version }}
      puppet_version: ${{ matrix.puppet_version }}
